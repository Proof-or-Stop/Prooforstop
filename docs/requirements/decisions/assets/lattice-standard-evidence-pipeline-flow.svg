<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2300" viewBox="0 0 1280 2300" role="img" aria-labelledby="title desc">
  <title id="title">Lattice Standard Evidence Pipeline Flow</title>
  <desc id="desc">Lifecycle orchestration flow showing proof-or-stop stages, refreshable evidence loops, reviewer outcomes, non-DONE readiness, and delegation to done_prepare for TEST-to-DONE readiness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#eef6f1"/>
      <stop offset="100%" stop-color="#fff8ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1b2a38" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35506a"/>
    </marker>
    <style>
      .title { font: 700 34px Georgia, serif; fill: #203246; }
      .subtitle { font: 400 18px Georgia, serif; fill: #4d6275; }
      .box-title { font: 700 17px Georgia, serif; fill: #16283a; }
      .box-text { font: 400 14px Georgia, serif; fill: #30485d; }
      .small { font: 400 13px Georgia, serif; fill: #51687b; }
      .label { font: 700 12px Georgia, serif; fill: #36506a; letter-spacing: 0.04em; }
      .flow { stroke: #35506a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .flow-soft { stroke: #7b8fa3; stroke-width: 1.8; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .stop { fill: #fff0ee; stroke: #cb5548; stroke-width: 2; }
      .stage { fill: #ffffff; stroke: #8fb0cb; stroke-width: 2; }
      .decision { fill: #fffaf0; stroke: #c99a3d; stroke-width: 2; }
      .done { fill: #edf8f0; stroke: #4b9b69; stroke-width: 2; }
      .delegated { fill: #eef4ff; stroke: #557eb8; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1280" height="2300" fill="url(#bg)"/>
  <text x="80" y="70" class="title">Lattice Standard Evidence Pipeline</text>
  <text x="80" y="102" class="subtitle">Proof-or-stop lifecycle orchestration; TEST-to-DONE readiness is delegated to B-fb36 done_prepare.</text>

  <g filter="url(#shadow)">
    <rect x="350" y="135" width="580" height="76" rx="18" class="stage"/>
    <text x="380" y="168" class="box-title">0. State intake + phase preflight</text>
    <text x="380" y="193" class="box-text">session_brief, cwd, phase, worktree, git status, target</text>
  </g>

  <path d="M640 211 L640 248" class="flow"/>

  <g filter="url(#shadow)">
    <path d="M640 248 L890 318 L640 388 L390 318 Z" class="decision"/>
    <text x="536" y="312" class="box-title">Any blocker, manual</text>
    <text x="552" y="337" class="box-title">decision, or external wait?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="390" width="270" height="104" rx="16" class="stop"/>
    <text x="970" y="425" class="box-title">STOP</text>
    <text x="970" y="450" class="box-text">print owner, blocker,</text>
    <text x="970" y="473" class="box-text">and exact next action</text>
  </g>

  <path d="M890 318 C1015 318 1075 350 1075 390" class="flow"/>
  <text x="930" y="301" class="label">YES</text>

  <path d="M640 388 L640 426" class="flow"/>
  <text x="655" y="412" class="label">NO</text>

  <g filter="url(#shadow)">
    <path d="M640 426 L850 490 L640 554 L430 490 Z" class="decision"/>
    <text x="556" y="485" class="box-title">Story still in PLAN?</text>
    <text x="542" y="510" class="box-text">Need skeleton + story_review?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="588" width="360" height="106" rx="18" class="stage"/>
    <text x="120" y="623" class="box-title">1. PLAN skeleton</text>
    <text x="120" y="648" class="box-text">checklist, understanding, decision,</text>
    <text x="120" y="671" class="box-text">verificationIntent, scope proposal</text>
  </g>

  <path d="M430 490 C275 500 230 548 230 588" class="flow"/>
  <text x="302" y="474" class="label">YES</text>
  <path d="M450 640 C520 640 540 590 580 545" class="flow-soft"/>
  <text x="462" y="624" class="small">story_review blockers loop back</text>

  <g filter="url(#shadow)">
    <rect x="500" y="588" width="430" height="92" rx="18" class="stage"/>
    <text x="530" y="623" class="box-title">DEV implementation</text>
    <text x="530" y="648" class="box-text">Code changes happen outside the pipeline command.</text>
  </g>

  <path d="M640 554 L640 588" class="flow"/>
  <text x="655" y="576" class="label">NO / ACCEPTED</text>
  <path d="M640 680 L640 720" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="350" y="720" width="580" height="112" rx="18" class="stage"/>
    <text x="380" y="755" class="box-title">2. Evidence plan + generation / refresh</text>
    <text x="380" y="780" class="box-text">Default plan-only; execute only with executeEvidence.</text>
    <text x="380" y="803" class="box-text">Freshness uses StoryPipelineReport readers.</text>
  </g>

  <path d="M640 832 L640 872" class="flow"/>

  <g filter="url(#shadow)">
    <path d="M640 872 L875 940 L640 1008 L405 940 Z" class="decision"/>
    <text x="538" y="935" class="box-title">Evidence missing or stale?</text>
    <text x="532" y="960" class="box-text">Classify before reviewer consumption.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="894" width="260" height="112" rx="18" class="delegated"/>
    <text x="110" y="929" class="box-title">Refresh-only stale</text>
    <text x="110" y="954" class="box-text">Use existing refresh writer.</text>
    <text x="110" y="977" class="box-text">Never rewrite hashes directly.</text>
  </g>

  <path d="M405 940 C350 940 342 944 340 950" class="flow-soft"/>
  <text x="342" y="922" class="label">REFRESHABLE</text>
  <path d="M210 894 C210 850 350 812 350 776" class="flow-soft"/>
  <text x="148" y="866" class="small">refresh, then reclassify</text>

  <path d="M875 940 C1015 940 1075 705 1075 494" class="flow-soft"/>
  <text x="898" y="919" class="label">RERUN REQUIRED</text>

  <path d="M640 1008 L640 1048" class="flow"/>
  <text x="655" y="1033" class="label">NO</text>

  <g filter="url(#shadow)">
    <rect x="350" y="1048" width="580" height="112" rx="18" class="stage"/>
    <text x="380" y="1083" class="box-title">3. Validation/transcript/context</text>
    <text x="380" y="1108" class="box-text">Validation, smoke/waiver, delivery context.</text>
    <text x="380" y="1131" class="box-text">Artifacts are current before final reviewers.</text>
  </g>

  <path d="M640 1160 L640 1200" class="flow"/>

  <g filter="url(#shadow)">
    <path d="M640 1200 L855 1260 L640 1320 L425 1260 Z" class="decision"/>
    <text x="528" y="1255" class="box-title">Validation and user proof pass?</text>
    <text x="540" y="1280" class="box-text">If unavailable, stop before review.</text>
  </g>

  <path d="M855 1260 C1005 1260 1075 905 1075 494" class="flow-soft"/>
  <text x="882" y="1240" class="label">NO</text>
  <path d="M640 1320 L640 1350" class="flow"/>
  <text x="655" y="1345" class="label">YES</text>

  <g filter="url(#shadow)">
    <rect x="350" y="1350" width="580" height="84" rx="18" class="stage"/>
    <text x="380" y="1383" class="box-title">Clean commit + enter REVIEW phase</text>
    <text x="380" y="1408" class="box-text">If dirty or not REVIEW, print story_advance and stop.</text>
  </g>

  <path d="M930 1392 C1005 1392 1075 980 1075 494" class="flow-soft"/>
  <text x="955" y="1373" class="label">BLOCKED</text>

  <path d="M640 1434 L640 1470" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="350" y="1470" width="580" height="96" rx="18" class="stage"/>
    <text x="380" y="1505" class="box-title">4. Final reviewer lanes</text>
    <text x="380" y="1530" class="box-text">Only after REVIEW phase; review current snapshot.</text>
  </g>

  <path d="M640 1566 L640 1604" class="flow"/>

  <g filter="url(#shadow)">
    <path d="M640 1604 L880 1672 L640 1740 L400 1672 Z" class="decision"/>
    <text x="517" y="1667" class="box-title">Missing lane, finding, or stale pass?</text>
    <text x="536" y="1692" class="box-text">Retry lane, return to DEV, or rerun stale lane.</text>
  </g>

  <path d="M400 1672 C280 1672 250 1570 350 1520" class="flow-soft"/>
  <text x="252" y="1638" class="label">MISSING / STALE</text>
  <path d="M880 1672 C1110 1618 1110 635 930 635" class="flow-soft"/>
  <text x="900" y="1652" class="label">FINDING -&gt; DEV</text>
  <path d="M640 1740 L640 1778" class="flow"/>
  <text x="655" y="1765" class="label">NO</text>

  <g filter="url(#shadow)">
    <rect x="350" y="1778" width="580" height="84" rx="18" class="stage"/>
    <text x="380" y="1812" class="box-title">5. REVIEW / TEST preflight</text>
    <text x="380" y="1837" class="box-text">Gate fail stops with source blocker.</text>
  </g>

  <path d="M930 1820 C1005 1820 1075 1450 1075 494" class="flow-soft"/>
  <text x="960" y="1800" class="label">BLOCKED</text>
  <path d="M640 1862 L640 1900" class="flow"/>

  <g filter="url(#shadow)">
    <path d="M640 1900 L870 1962 L640 2024 L410 1962 Z" class="decision"/>
    <text x="512" y="1957" class="box-title">Delivery check missing or blocking?</text>
    <text x="548" y="1982" class="box-text">Run delivery reviewer and stop.</text>
  </g>

  <path d="M870 1962 C1005 1962 1075 1510 1075 494" class="flow-soft"/>
  <text x="890" y="1942" class="label">YES</text>
  <path d="M640 2024 L640 2062" class="flow"/>
  <text x="655" y="2049" class="label">NO</text>

  <g filter="url(#shadow)">
    <path d="M640 2062 L870 2124 L640 2186 L410 2124 Z" class="decision"/>
    <text x="526" y="2119" class="box-title">Target DONE and story in TEST?</text>
    <text x="548" y="2144" class="box-text">Non-DONE target stops ready here.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="2070" width="260" height="92" rx="18" class="done"/>
    <text x="110" y="2105" class="box-title">7. Phase advance handoff</text>
    <text x="110" y="2130" class="box-text">Non-DONE: print allowed story_advance.</text>
  </g>

  <path d="M410 2124 C380 2124 358 2120 340 2117" class="flow"/>
  <text x="350" y="2100" class="label">NO</text>

  <g filter="url(#shadow)">
    <rect x="940" y="2048" width="270" height="108" rx="18" class="delegated"/>
    <text x="970" y="2083" class="box-title">6. Delegate to done_prepare</text>
    <text x="970" y="2108" class="box-text">Import bound PASS or preserve</text>
    <text x="970" y="2131" class="box-text">blockedAt / next exactly.</text>
  </g>

  <path d="M870 2124 C900 2124 918 2107 940 2102" class="flow"/>
  <text x="888" y="2100" class="label">YES</text>

  <g filter="url(#shadow)">
    <rect x="940" y="2180" width="270" height="70" rx="18" class="done"/>
    <text x="970" y="2208" class="box-title">7. Phase advance handoff</text>
    <text x="970" y="2232" class="box-text">done_prepare PASS; print/execute DONE</text>
  </g>

  <path d="M1075 2156 L1075 2180" class="flow"/>
  <path d="M1210 2102 C1244 1850 1205 760 1075 494" class="flow-soft"/>
  <text x="1132" y="1988" class="label">BLOCKED</text>
</svg>
