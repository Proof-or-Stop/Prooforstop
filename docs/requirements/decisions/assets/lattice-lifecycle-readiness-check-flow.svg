<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1380" viewBox="0 0 1280 1380" role="img" aria-labelledby="title desc">
  <title id="title">Lattice Lifecycle Proof-Or-Stop Readiness Check Flow</title>
  <desc id="desc">Read-only V1 lifecycle readiness flow that builds StoryReadinessReport, stops on missing proof, and prints exact next actions without running commands or writing evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbf7"/>
      <stop offset="52%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#203040" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344e67"/>
    </marker>
    <style>
      .title { font: 700 34px Georgia, serif; fill: #203246; }
      .subtitle { font: 400 18px Georgia, serif; fill: #465d72; }
      .box-title { font: 700 17px Georgia, serif; fill: #15283a; }
      .box-text { font: 400 14px Georgia, serif; fill: #30485d; }
      .small { font: 400 13px Georgia, serif; fill: #51687b; }
      .label { font: 700 12px Georgia, serif; fill: #36506a; letter-spacing: 0.04em; }
      .flow { stroke: #344e67; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .flow-soft { stroke: #758da3; stroke-width: 1.8; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .stage { fill: #ffffff; stroke: #8dafc9; stroke-width: 2; }
      .decision { fill: #fffaf0; stroke: #c99a3d; stroke-width: 2; }
      .stop { fill: #fff0ee; stroke: #cb5548; stroke-width: 2; }
      .ready { fill: #edf8f0; stroke: #4b9b69; stroke-width: 2; }
      .deferred { fill: #eef2f7; stroke: #66788a; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1280" height="1380" fill="url(#bg)"/>
  <text x="80" y="70" class="title">Lattice Lifecycle Proof-Or-Stop Readiness Check</text>
  <text x="80" y="102" class="subtitle">V1 is read-only: build StoryReadinessReport, stop on missing proof, print exact next actions.</text>

  <g filter="url(#shadow)">
    <rect x="330" y="145" width="620" height="92" rx="18" class="stage"/>
    <text x="365" y="180" class="box-title">1. Read current lifecycle facts</text>
    <text x="365" y="205" class="box-text">phase, cwd, git, checklist, validation, review, delivery, done_prepare</text>
  </g>

  <path d="M640 237 L640 280" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="330" y="280" width="620" height="112" rx="18" class="stage"/>
    <text x="365" y="316" class="box-title">2. Build StoryReadinessReport</text>
    <text x="365" y="341" class="box-text">runCommands:false, writeEvidence:false</text>
    <text x="365" y="365" class="box-text">No evidence writes, no reviewers, no phase changes, no Authority claims.</text>
  </g>

  <path d="M640 392 L640 435" class="flow"/>

  <g filter="url(#shadow)">
    <path d="M640 435 L900 515 L640 595 L380 515 Z" class="decision"/>
    <text x="520" y="510" class="box-title">Target proof complete?</text>
    <text x="498" y="535" class="box-text">missing, stale, blocking, manual, external?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="470" width="290" height="118" rx="18" class="stop"/>
    <text x="965" y="506" class="box-title">STOP</text>
    <text x="965" y="531" class="box-text">print source blocker, owner,</text>
    <text x="965" y="554" class="box-text">category, and exact next action</text>
  </g>

  <path d="M900 515 L930 529" class="flow"/>
  <text x="904" y="497" class="label">NO</text>

  <path d="M640 595 L640 645" class="flow"/>
  <text x="655" y="623" class="label">YES</text>

  <g filter="url(#shadow)">
    <rect x="330" y="645" width="620" height="94" rx="18" class="ready"/>
    <text x="365" y="681" class="box-title">3. Report ready from existing proof</text>
    <text x="365" y="706" class="box-text">readiness is local unless separate verified receipts exist</text>
  </g>

  <path d="M640 739 L640 782" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="330" y="782" width="620" height="96" rx="18" class="ready"/>
    <text x="365" y="818" class="box-title">4. Print next lifecycle command only</text>
    <text x="365" y="843" class="box-text">No command execution in V1; host chooses whether to run it.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="640" width="250" height="134" rx="18" class="stop"/>
    <text x="112" y="675" class="box-title">Rollback needed?</text>
    <text x="112" y="700" class="box-text">REVIEW/TEST blocker:</text>
    <text x="112" y="724" class="box-text">print story_advance</text>
    <text x="112" y="747" class="box-text">phase=DEV command</text>
  </g>

  <path d="M965 588 C810 660 470 675 330 706" class="flow-soft"/>
  <text x="565" y="649" class="label">EXACT NEXT ACTIONS</text>

  <path d="M930 565 C650 610 345 612 235 640" class="flow-soft"/>
  <text x="390" y="590" class="small">if implementation work is required</text>

  <g filter="url(#shadow)">
    <rect x="80" y="950" width="1120" height="270" rx="24" class="deferred"/>
    <text x="120" y="990" class="box-title">Full Vision: deferred staged layers, not V1</text>
    <text x="120" y="1020" class="box-text">PLAN skeleton generation, evidence planning, one-pass refresh orchestration, transcript writing, delivery context, reviewer batches, and top-level orchestration.</text>
    <text x="120" y="1050" class="box-text">Each future layer must keep runCommands and writeEvidence independent, explicit, and fail-closed.</text>
    <text x="120" y="1080" class="box-text">Metadata-only waiver can satisfy only live-smoke transcript proof, not validation, review, delivery, done_prepare, DONE, Authority, or production readiness.</text>
    <text x="120" y="1110" class="box-text">Single-host fallback semantics are deferred; V1 makes no fallback readiness claim.</text>
    <text x="120" y="1150" class="small">Reserved future integration: story_pipeline may exist only after the read-only readiness model and component contracts land.</text>
  </g>

  <path d="M640 878 L640 950" class="flow-soft"/>
</svg>
